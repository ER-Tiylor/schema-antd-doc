<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">schema-antd</title>
  <desc id="heroDesc">浅色系表单卡片，其中一个字段下拉出候选选项</desc>
  <defs>
    <linearGradient id="heroBlob" x1="26" y1="20" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DEEBFE" />
      <stop offset="0.55" stop-color="#EAF3FF" />
      <stop offset="1" stop-color="#F3F8FF" />
    </linearGradient>
    <filter id="heroCardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4C6FB8" flood-opacity="0.16" />
    </filter>
    <filter id="heroPopShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#3C6BD1" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- 背景色块 -->
  <ellipse cx="104" cy="102" rx="84" ry="80" fill="url(#heroBlob)" />
  <circle cx="158" cy="46" r="21" fill="#E3F8F1" />
  <circle cx="46" cy="158" r="16" fill="#FFF1DF" />

  <!-- 点缀 -->
  <path d="M36 46v12M30 52h12" stroke="#B7D3FF" stroke-width="3" stroke-linecap="round" />
  <path d="M170 132v9M165.5 136.5h9" stroke="#B7D3FF" stroke-width="3" stroke-linecap="round" />

  <!-- 表单卡片 -->
  <rect x="36" y="26" width="116" height="112" rx="18" fill="#FFFFFF" stroke="#E1EDFE" stroke-width="1.5" filter="url(#heroCardShadow)" />

  <!-- 卡片头部 -->
  <circle cx="54" cy="44" r="3.5" fill="#C9DDFB" />
  <circle cx="66" cy="44" r="3.5" fill="#B9EBE1" />
  <circle cx="78" cy="44" r="3.5" fill="#FFD9AC" />
  <rect x="92" y="41" width="44" height="6" rx="3" fill="#E9F1FD" />

  <!-- 字段一：聚焦态 -->
  <rect x="52" y="58" width="20" height="7" rx="3.5" fill="#E3EDFC" />
  <rect x="78" y="54" width="56" height="16" rx="8" fill="#F4F9FF" stroke="#7CB2FF" stroke-width="2" />
  <path d="M87 58.5v7" stroke="#1677FF" stroke-width="2" stroke-linecap="round" />

  <!-- 字段二 -->
  <rect x="52" y="82" width="20" height="7" rx="3.5" fill="#E3EDFC" />
  <rect x="78" y="78" width="56" height="16" rx="8" fill="#F7FAFF" stroke="#D8E7FC" stroke-width="1.5" />

  <!-- 字段三：下拉 -->
  <rect x="52" y="106" width="20" height="7" rx="3.5" fill="#E3EDFC" />
  <rect x="78" y="102" width="56" height="16" rx="8" fill="#F7FAFF" stroke="#D8E7FC" stroke-width="1.5" />
  <path d="M120 109.5l3.2 3.2 3.2-3.2" fill="none" stroke="#8AAFE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 下拉候选 -->
  <rect x="78" y="122" width="84" height="62" rx="13" fill="#FFFFFF" stroke="#D9E8FC" stroke-width="1.5" filter="url(#heroPopShadow)" />

  <circle cx="94" cy="138" r="5.5" fill="#1677FF" />
  <path d="M91.4 138.1l1.9 1.9 3.4-4" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="106" y="135" width="44" height="6" rx="3" fill="#DCECFF" />

  <circle cx="94" cy="156" r="5.5" fill="#FFFFFF" stroke="#D6E4FA" stroke-width="1.5" />
  <rect x="106" y="153" width="38" height="6" rx="3" fill="#EFF4FC" />

  <circle cx="94" cy="174" r="5.5" fill="#FFFFFF" stroke="#D6E4FA" stroke-width="1.5" />
  <rect x="106" y="171" width="46" height="6" rx="3" fill="#EFF4FC" />
</svg>
