<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">schema-antd</title>
  <desc id="desc">浅色系的表单卡片与业务下拉选择器示意</desc>
  <defs>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#5B8DEF" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- 浅色背景色块 -->
  <ellipse cx="100" cy="106" rx="82" ry="78" fill="#EAF4FF" />
  <circle cx="154" cy="54" r="24" fill="#E7FAF4" />
  <circle cx="40" cy="154" r="18" fill="#FFF3E4" />

  <!-- 点缀 -->
  <path d="M44 50v12M38 56h12" stroke="#BBD8FF" stroke-width="3" stroke-linecap="round" />
  <path d="M162 136v10M157 141h10" stroke="#BBD8FF" stroke-width="3" stroke-linecap="round" />

  <!-- 表单卡片 -->
  <rect x="40" y="40" width="108" height="120" rx="20" fill="#FFFFFF" stroke="#D8E7FF" stroke-width="2" filter="url(#cardShadow)" />

  <!-- 卡片头部 -->
  <circle cx="58" cy="58" r="4" fill="#C9DDFB" />
  <circle cx="70" cy="58" r="4" fill="#B9EBE1" />
  <circle cx="82" cy="58" r="4" fill="#FFD9AC" />
  <rect x="94" y="55" width="38" height="6" rx="3" fill="#E6EFFC" />

  <!-- 字段行 -->
  <rect x="56" y="80" width="20" height="7" rx="3.5" fill="#E8F0FD" />
  <rect x="84" y="76" width="48" height="15" rx="7.5" fill="#F6FAFF" stroke="#DCE9FE" stroke-width="1.5" />
  <path d="M90 79v9" stroke="#1677FF" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

  <rect x="56" y="104" width="20" height="7" rx="3.5" fill="#E8F0FD" />
  <rect x="84" y="100" width="48" height="15" rx="7.5" fill="#F6FAFF" stroke="#DCE9FE" stroke-width="1.5" />

  <rect x="56" y="128" width="20" height="7" rx="3.5" fill="#E8F0FD" />
  <rect x="84" y="124" width="48" height="15" rx="7.5" fill="#F6FAFF" stroke="#DCE9FE" stroke-width="1.5" />

  <!-- 提交按钮 -->
  <rect x="56" y="146" width="38" height="10" rx="5" fill="#1677FF" opacity="0.9" />

  <!-- 下拉候选 -->
  <rect x="112" y="94" width="72" height="62" rx="13" fill="#FFFFFF" stroke="#CFE1FF" stroke-width="2" filter="url(#cardShadow)" />

  <circle cx="126" cy="110" r="5.5" fill="#E8F3FF" stroke="#1677FF" stroke-width="1.5" />
  <path d="M123.5 110.2l1.8 1.8 3.2-3.8" fill="none" stroke="#1677FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="138" y="107" width="34" height="6" rx="3" fill="#DCEBFF" />

  <circle cx="126" cy="126" r="5.5" fill="#FFFFFF" stroke="#D6E4FA" stroke-width="1.5" />
  <rect x="138" y="123" width="38" height="6" rx="3" fill="#EEF4FD" />

  <circle cx="126" cy="142" r="5.5" fill="#FFFFFF" stroke="#D6E4FA" stroke-width="1.5" />
  <rect x="138" y="139" width="30" height="6" rx="3" fill="#EEF4FD" />
</svg>
